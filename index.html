<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: preconnect + stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
    />

    <!-- SEO -->
    <title>Bahaa Youssof — Frontend Engineer</title>
    <meta
      name="description"
      content="Frontend Engineer specializing in React, TypeScript, and high-performance web interfaces. 5+ years building SaaS and FinTech applications."
    />
    <meta name="author" content="Bahaa Youssof" />
    <meta
      name="keywords"
      content="Frontend Engineer, React, TypeScript, Next.js, Vue.js, FinTech, SaaS, Portfolio"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bahaa Youssof — Frontend Engineer" />
    <meta
      property="og:description"
      content="Frontend Engineer specializing in React, TypeScript, and high-performance web interfaces."
    />
    <meta property="og:url" content="https://bahaayoussof.com" />
    <meta property="og:image" content="https://bahaayoussof.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bahaa Youssof — Frontend Engineer" />
    <meta
      name="twitter:description"
      content="Frontend Engineer specializing in React, TypeScript, and high-performance web interfaces."
    />
    <meta name="twitter:image" content="https://bahaayoussof.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Set saved theme before first paint to avoid a dark->light flash on load -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
